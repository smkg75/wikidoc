# wikidoc — a filled, realistic example. Read it for the shape; write your own
# from your own evidence. Setup never copies this file.
#
# The scripts read this, and so does the agent — the comments are part of the
# contract. Write the `notes:` a stranger would need.

# Where this workspace lives. $WIKIDOC_HOME wins over it, and the
# self-ingestion guard follows whichever is in force — so the tool never
# ingests its own ledger, whatever this line says.
workspace: ~/.wikidoc
root: ~/Documents
language: fr                   # the language summaries are written in
batch_size: 300

exclude:                        # glob patterns, matched against paths under root
  - "*/node_modules/*"
  - "*/.git/*"
  - "Personal/Code/*"
  - "Work/mobile-app/*"        # a code checkout, not a document

# Regexes that turn text into identifiers. Longest pattern wins first, so a
# 14-digit SIRET is not also harvested as a 9-digit SIREN.
identifiers:
  siret: '\b\d{3}[ .]?\d{3}[ .]?\d{3}[ .]?\d{5}\b'
  siren: '\b\d{3}[ .]?\d{3}[ .]?\d{3}\b'
  vat: '\bFR\d{2}\d{9}\b'

# Who a document can belong to. An entity is a person, a household, an employer,
# a landlord, a company — whatever your documents are about. Most people have
# one or two and no company at all; this whole block is optional.
#
# An entity is recognised either by an `ids:` value found in the text, or by a
# `match:` condition (same vocabulary as a rule's `when:`). Give it a `bucket:`
# only if you want `{entity}` usable in a destination.
#
# Documents name several entities at once, so the STRONGEST evidence wins:
#   3  an `ids:` value read in the content        (company number, account ref)
#   2  a `match:` on the text                     (a name printed on the page)
#   1  a `match:` on the path or filename         (where the file happens to sit)
# The order below decides nothing. Two entities tied at the top — a contract
# between two companies — go to the propose lane, where reading decides.
entities:
  - name: Me
    match: {any: [{text_contains_any: [jane doe, j. doe]}]}
    bucket: Personal
    notes: >
      Everything addressed to me personally. My name is spelled two ways across
      documents, hence the two variants.

  - name: My landlord
    ids: ["4471120"]            # the tenant reference printed on every statement
    bucket: Personal/Housing
    notes: The reference stays the same across agencies; the agency name does not.

  - name: ACME
    ids: ["123456789", "12345678900021"]
    bucket: ACME
    notes: >
      Only if you run a company. Trade name differs from the legal entity — both
      appear in documents, and the bank statements use the legal one. Employee
      papers follow the entity of the period, not the person: the same employee
      moved between entities in 2024.

# Guards, not rules: these run ahead of everything and cannot be overridden.
# A match forces the propose lane, and makes the file untrashable.
sensitive:
  text_contains_any: [passeport, carte d'identité, relevé d'identité bancaire,
                      iban, bulletin de paie, résultats d'analyses, ordonnance]
  path_under: [Personal/Identity, Personal/Health]
  id_kind_present: [iban]

# Tag name -> Finder colour (macOS). Elsewhere the names still land in the
# ledger; only the colours are lost.
tags:
  facture: 5        # yellow
  contrat: 3        # purple
  fiscal: 7         # orange
  identité: 2       # green
  santé: 4          # blue

# Combien une regle shadow doit avoir prouve avant d'etre soumise.
rules_review:
  min_passes: 2
  min_hits: 5

review:
  banned_phrases: ["ce document semble", "il s'agit probablement",
                   "this document appears to"]

rules:
  # First match wins among ACTIVE rules, so order matters: specific above general.
  #
  # `status: shadow` is where a rule starts and usually stays for a while. It is
  # evaluated every pass and never applied; close.py scores what it proposed
  # against what was decided and fills in passes / hits / agreed / disagreed.
  # It is put to you only once it has passes, hits, and zero disagreement.
  - id: rent-receipt
    status: active            # promoted after 4 passes with no divergence
    learned_from: 2026-08-08
    passes: 4
    hits: 47                  # bumped by route.py — 0 after ten passes means dead
    agreed: 47
    disagreed: 0
    when:
      all:
        - text_contains_any: [quittance de loyer]
        - has_text: true
    level: route
    tag: facture
    destination: "Personal/Housing/rent-receipts-{doc_year}"

  - id: acme-invoice
    status: shadow            # still earning its place
    learned_from: 2026-08-08
    passes: 1
    hits: 6
    agreed: 6
    disagreed: 0
    when:
      all:
        - text_contains_any: [facture]
        - ids_any: ["123456789"]
    level: route
    tag: facture
    destination: "{entity}/Accounting/invoices-{doc_year}"

  - id: bank-statement
    status: shadow
    learned_from: 2026-08-09
    passes: 2
    hits: 9
    agreed: 7
    disagreed: 2             # diverge deux fois : a reecrire avant promotion
    when:
      all:
        - text_contains_any: [relevé de compte]
        - not: {text_contains_any: [relevé d'identité bancaire]}
    level: propose            # money: a human confirms before anything moves
    destination: "Personal/Bank/{doc_year}"

  - id: screenshot-clutter
    status: shadow
    learned_from: 2026-08-09
    passes: 0
    hits: 0
    when:
      all:
        - name_matches: '^(Capture d.écran|Screenshot)'
        - ext_in: [.png]
    level: propose            # a name-only rule is capped here anyway
